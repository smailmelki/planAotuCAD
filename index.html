<style>
:root{--bg:#eef2f5;--cv:#f7f9fb;--grid:#e1e8ee;--major:#c8d4de;--ln:#15324b;--ac:#b45309;--dim:#5b6f80;--ui:#fff;--tx:#15324b;--bd:#cfd9e1;color-scheme:light}

:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:14px/1.4 "IBM Plex Sans Arabic",system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden;-webkit-user-select:none;user-select:none}

button{background:none;border:0;padding:8px;min-height:44px;cursor:pointer}

header{display:flex;align-items:center;gap:2px;padding:2px 8px 2px 12px;border-bottom:1px solid var(--bd);background:var(--ui)}
header b{font-weight:600;font-size:16px}

#smenu.on{display:flex}

.gm{position:absolute;inset:auto 0 0 0;background:var(--ui);border-top:1px solid var(--bd);padding:10px;display:none;flex-wrap:wrap;gap:8px;justify-content:center}.gm.on{display:flex}
.lr{display:flex;gap:6px;align-items:center}.lr button{min-height:40px;padding:4px 8px;font-size:12px;color:var(--dim)}.lr.on button:first-child{color:var(--ac)}#sheet .lr input{width:auto;flex:1;min-width:0}.lr.on input{border-color:var(--ac)}

#opk{background:var(--tx);color:var(--ui)}
#stg{font-size:18px;padding:8px 10px}
header button{padding:8px 9px}header svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{min-height:38px;padding:4px 12px;border:1px solid var(--bd);border-radius:20px;color:var(--dim)}#stg{position:relative}#stg.warn::after{content:"";position:absolute;top:7px;right:5px;width:9px;height:9px;border-radius:50%;background:var(--ac)}
.chip.on{color:var(--ac);border-color:var(--ac)}
#gfurn{max-height:60%;overflow:auto}#gfurn button{flex:0 0 70px;font-size:11px}.gm svg *{vector-effect:non-scaling-stroke}
#tot{cursor:pointer}.at{display:grid;grid-template-columns:34px 1fr auto auto;gap:4px 12px;align-items:center;font-size:13px;max-height:38vh;overflow:auto}.ah{color:var(--dim);font-size:12px}.ack{min-height:32px;padding:0;font-size:18px;color:var(--ac)}.anm{font-weight:600;text-decoration:underline dotted;cursor:pointer}
.gm button{flex:0 0 76px;display:flex;flex-direction:column;align-items:center;gap:4px;border:1px solid var(--bd);border-radius:10px;font-size:12px;color:var(--dim);padding:10px 4px}.gm button.on{color:var(--ac);border-color:var(--ac)}

.lb{position:relative;display:flex;align-items:center;justify-content:center;min-height:44px;overflow:hidden}#sheet .lb input{position:absolute;inset:0;width:100%;height:100%;padding:0;border:0;opacity:0;cursor:pointer}

<nav>

<input type="file" id="fin" hidden><div id="tt"></div>
<div id="io" hidden><textarea id="iot" spellcheck="false"></textarea><p id="iop"></p><div class="row"><button class="fl" id="ioa"></button><button class="fl" id="iox">إغلاق</button></div></div>
<div id="ov" hidden><img alt="المخطط"><p>اضغط مطولًا على الصورة لحفظها في هاتفك</p><button id="ovx">إغلاق</button></div>

<script>
(()=>{
const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s),cv=$('#cv');let ctx=cv.getContext('2d');
const FONT='"IBM Plex Sans Arabic",system-ui,sans-serif',COLS=['','#dc2626','#ea580c','#16a34a','#2563eb','#9333ea','#0d9488','#6b7280'];
const NM={end:'نهاية',mid:'منتصف',int:'تقاطع',cen:'مركز',qua:'ربع'};
// الأشكال بالمتر: line{a,b} rect{x,y,w,h} circle{x,y,r} tri{p} free{p} + اختياري name,col,lw
let shapes=[],redo=[],hist=nh(),sel=[],clip=[],tool='rect',cur=null,g=null,box=null,mk=null,V={x:24,y:24,s:40},dpr=1,W=0,H=0;
let S={end:1,mid:1,int:1,cen:1,grid:1,ortho:0,polar:0,dyn:1},D={col:'',lw:2},ST={unit:'m',gs:0,axes:1,coord:1,grid:1,cloud:0,bk:0},cpos=null,furnKind='bed2',cloudT=0,cloudAt=0,fileHintT=0;
const P=new Map();
const f=n=>(Math.round(n*100)/100).toFixed(2).replace(/\.?0+$/,'');
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const num=v=>parseFloat(String(v).replace(/[٠-٩]/g,d=>d.charCodeAt(0)-1632).replace('٫','.').replace(',','.'));
const len=s=>Math.hypot(s.b[0]-s.a[0],s.b[1]-s.a[1]);
const w2s=(x,y)=>[V.x+x*V.s,V.y+y*V.s],s2w=(x,y)=>[(x-V.x)/V.s,(y-V.y)/V.s];
const pos=e=>{const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
const pts=s=>s.t==='line'||s.t==='wall'||s.t==='dim'?[s.a,s.b]:s.p?s.p:s.t==='door'||s.t==='win'?[[s.x-Math.cos(s.a)*s.w/2,s.y-Math.sin(s.a)*s.w/2],[s.x+Math.cos(s.a)*s.w/2,s.y+Math.sin(s.a)*s.w/2]]:s.t==='text'||s.t==='north'?rc(nb(s)):rc(s);
// مستطيل تقريبي حول نص أو سهم شمال (للتحديد والتدوير)
const mcx=document.createElement('canvas').getContext('2d');
function nb(s){let w=s.h;if(s.t==='text'){mcx.font=`600 100px ${FONT}`;w=Math.max(s.h*.6,mcx.measureText(s.txt||' ').width/100*s.h)}return{x:s.x-w/2,y:s.y-s.h/2,w,h:s.h,rot:s.a||0}}
// المستطيل: x,y,w,h + rot (زاوية بالراديان حول المركز)
function rc(s){const cx=s.x+s.w/2,cy=s.y+s.h/2,c=Math.cos(s.rot||0),n=Math.sin(s.rot||0);return[[-s.w/2,-s.h/2],[s.w/2,-s.h/2],[s.w/2,s.h/2],[-s.w/2,s.h/2]].map(q=>[cx+q[0]*c-q[1]*n,cy+q[0]*n+q[1]*c])}
const rp=(q,c,a)=>{const co=Math.cos(a),si=Math.sin(a),dx=q[0]-c[0],dy=q[1]-c[1];return[c[0]+dx*co-dy*si,c[1]+dx*si+dy*co]};
function rotS(s,o,c,a){
  if(s.t==='line'||s.t==='wall'||s.t==='dim'){s.a=rp(o.a,c,a);s.b=rp(o.b,c,a)}
  else if(s.p)s.p=o.p.map(q=>rp(q,c,a));
  else if(s.t==='rect'||s.t==='furn'){const m=rp([o.x+o.w/2,o.y+o.h/2],c,a);s.x=m[0]-o.w/2;s.y=m[1]-o.h/2;s.rot=(o.rot||0)+a}
  else{const m=rp([o.x,o.y],c,a);s.x=m[0];s.y=m[1];if(o.a!=null)s.a=o.a+a}
}
function selC(){const b=sel.map(i=>bx(shapes[i]));return[(Math.min(...b.map(q=>q.x))+Math.max(...b.map(q=>q.X)))/2,(Math.min(...b.map(q=>q.y))+Math.max(...b.map(q=>q.Y)))/2]}
// المقابض: نقاط التعديل + مقبض التدوير فوق التحديد
function grips(){
  if(tool!=='select'||!sel.length||(g&&g.k==='box'))return[];
  const r=[],s=sel.length===1?shapes[sel[0]]:null,b=sel.map(i=>bx(shapes[i])),x0=Math.min(...b.map(q=>q.x)),x1=Math.max(...b.map(q=>q.X)),y0=Math.min(...b.map(q=>q.y)),top=w2s((x0+x1)/2,y0);
  if(!sel.every(i=>shapes[i].t==='door'||shapes[i].t==='win'))r.push({id:'rot',sp:[top[0],top[1]-34],top});
  const add=(id,p)=>r.push({id,sp:w2s(...p)});
  if(s){if(s.t==='dim'){add('a',s.a);add('b',s.b);const d=dimPts(s);add('o',[(d[0][0]+d[1][0])/2,(d[0][1]+d[1][1])/2])}else if(s.t==='line'||s.t==='wall'){add('a',s.a);add('b',s.b)}else if(s.t==='tri')s.p.forEach((q,i)=>add(i,q));else if(s.t==='rect'||s.t==='furn')rc(s).forEach((q,i)=>add(i,q));else if(s.t==='circle')add('r',[s.x+s.r,s.y])}
  return r;
}
// تحديد بإطار: من اليسار لليمين = داخلي (الأشكال داخل الإطار بالكامل)، من اليمين لليسار = بالتقاطع (كل ما يلمسه الإطار)
function boxSel(){
  if(!box)return[];
  const a=s2w(box.x0,box.y0),b=s2w(box.x1,box.y1),x=Math.min(a[0],b[0]),X=Math.max(a[0],b[0]),y=Math.min(a[1],b[1]),Y=Math.max(a[1],b[1]),cross=box.x1<box.x0;
  return shapes.map((_,i)=>i).filter(i=>{if(!ed(shapes[i]))return false;const r=bx(shapes[i]);return cross?r.x<=X&&r.X>=x&&r.y<=Y&&r.Y>=y:r.x>=x&&r.X<=X&&r.y>=y&&r.Y<=Y});
}
const gripAt=p=>grips().find(q=>Math.hypot(q.sp[0]-p[0],q.sp[1]-p[1])<=22);
// أقرب نقطة على جدار (خط أو ضلع غرفة/مثلث) ضمن نصف قطر r بالمتر
function wallAt(p,r){let best=null,bd=r;for(const s of shapes)if(shown(s))for(const e of segs(s)){const a=e[0],b=e[1],dx=b[0]-a[0],dy=b[1]-a[1],l=dx*dx+dy*dy;if(!l)continue;const t=clamp(((p[0]-a[0])*dx+(p[1]-a[1])*dy)/l,0,1),q=[a[0]+t*dx,a[1]+t*dy],d=Math.hypot(q[0]-p[0],q[1]-p[1]);if(d<bd){bd=d;best={q,a:Math.atan2(dy,dx),th:s.t==='wall'?s.th:0}}}return best}
const plen=p=>p.reduce((a,q,i)=>i?a+Math.hypot(q[0]-p[i-1][0],q[1]-p[i-1][1]):0,0);

function roomList(){

  const claim=new Map();

    let best=null;R.forEach(o=>{if(inside(o.s,[t.x,t.y])&&(!best||area(o.s)<area(best.s)))best=o});

function dxfEntities(txt){

async function cloudPush(all){

function trimAt(p){

  const par=q=>((q[0]-A[0])*dx+(q[1]-A[1])*dy)/L2,t0=clamp(par(w),0,1),ts=[];
  shapes.forEach((o,k)=>{if(k===i||!shown(o))return;segs(o).forEach(e=>xSS([A,B],e).forEach(q=>ts.push(par(q))));if(o.t==='circle')xSC([A,B],o).forEach(q=>ts.push(par(q)))});

// القيود: أفقي/رأسي (Ortho) أو زاوية كل 15° (Polar)، والالتقاط بالنقاط يتقدم عليهما
function constrain(a,b){
